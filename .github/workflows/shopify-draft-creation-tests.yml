name: Shopify Draft Creation Tests
on:
  pull_request:
    paths:
      - 'tools/shopify_product_create.py'
      - 'tools/shopify_product_pages.py'
      - 'tests/test_shopify_product_create.py'
      - '.github/workflows/shopify-draft-creation-tests.yml'
  push:
    branches: [main]
    paths:
      - 'tools/shopify_product_create.py'
      - 'tools/shopify_product_pages.py'
      - 'tests/test_shopify_product_create.py'
      - '.github/workflows/shopify-draft-creation-tests.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test draft creation without Shopify credentials
        run: python -m unittest discover -s tests -p 'test_shopify_product_create.py' -v
      - name: Compile new utility
        run: python -m compileall -q tools/shopify_product_create.py
