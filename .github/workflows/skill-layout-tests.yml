name: OpenClaw modular skill validation
on:
  push:
    paths:
      - 'skills/**'
      - 'tests/test_skill_layout.py'
      - 'README.md'
      - 'TOOLS.md'
      - 'AGENTS.md'
      - '.github/workflows/skill-layout-tests.yml'
  pull_request:
    paths:
      - 'skills/**'
      - 'tests/test_skill_layout.py'
      - 'README.md'
      - 'TOOLS.md'
      - 'AGENTS.md'
      - '.github/workflows/skill-layout-tests.yml'

permissions:
  contents: read

jobs:
  layout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest tests.test_skill_layout
