name: Customer journey attribution tests
on:
  pull_request:
    paths:
      - 'tools/multi_touch_attribution.py'
      - 'tools/shopify_ga4_pipeline.py'
      - 'tests/test_multi_touch_attribution.py'
      - 'tests/test_shopify_ga4_pipeline.py'
      - '.github/workflows/attribution-tests.yml'
  push:
    branches: [main]
    paths:
      - 'tools/multi_touch_attribution.py'
      - 'tools/shopify_ga4_pipeline.py'
      - 'tests/test_multi_touch_attribution.py'
      - 'tests/test_shopify_ga4_pipeline.py'
      - '.github/workflows/attribution-tests.yml'
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m unittest discover -s tests -p 'test_multi_touch_attribution.py' -v
      - run: python3 -m unittest discover -s tests -p 'test_shopify_ga4_pipeline.py' -v
      - run: |
          python3 tools/shopify_ga4_pipeline.py \
            --ga4-events examples/ga4_bigquery_events.csv \
            --shopify-orders examples/shopify_attribution_orders.csv \
            --model linear --output /tmp/ga4-report.json
          python3 -c "import json; r=json.load(open('/tmp/ga4-report.json')); assert r['pipeline_audit']['ga4_matched_orders'] == 2"
