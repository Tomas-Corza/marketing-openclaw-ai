name: Shopify feed tests
on:
  push:
    paths:
      - 'tools/shopify_*.py'
      - 'tests/test_shopify_*.py'
      - '.github/workflows/shopify-feed-tests.yml'
  pull_request:
    paths:
      - 'tools/shopify_*.py'
      - 'tests/test_shopify_*.py'
      - '.github/workflows/shopify-feed-tests.yml'
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_shopify_*.py'
