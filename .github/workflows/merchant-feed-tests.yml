name: Merchant feed diagnostics tests
on:
  push:
    paths:
      - 'tools/merchant_*.py'
      - 'tests/test_merchant_*.py'
      - '.github/workflows/merchant-feed-tests.yml'
  pull_request:
    paths:
      - 'tools/merchant_*.py'
      - 'tests/test_merchant_*.py'
      - '.github/workflows/merchant-feed-tests.yml'
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_merchant_*.py'
