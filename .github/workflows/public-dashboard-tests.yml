name: Streamlit public demo smoke test
on:
  push:
    paths:
      - 'dashboard/**'
      - 'examples/dashboard/**'
      - 'tests/test_public_dashboard.py'
      - '.github/workflows/public-dashboard-tests.yml'
  pull_request:
    paths:
      - 'dashboard/**'
      - 'examples/dashboard/**'
      - 'tests/test_public_dashboard.py'
      - '.github/workflows/public-dashboard-tests.yml'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r dashboard/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_public_dashboard.py' -v
      - run: python -m unittest discover -s tests -p 'test_operations_dashboard.py' -v
